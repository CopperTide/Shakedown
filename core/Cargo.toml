[workspace]
resolver = "2"
members = ["crates/shaked", "crates/parts", "crates/shakedown-schema", "crates/project"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
serde_yaml_ng = "0.10"
serde_path_to_error = "0.1"
schemars = "1"
similar = "2"
sha2 = "0.11"
tempfile = "3"
madl = { git = "https://github.com/CopperTide/Multi-Agent-Descriptor-Language", rev = "3b5b7c91a4fcc5b7648b0c5b7b91dcb32a86b723" }

[workspace.lints.clippy]
too_many_lines = "warn"
