# `arenad`, the name shaked had until 2026-11-19: the same program (shaked's own `src/main.rs`) under
# its old name, so `cargo run -p arenad`, `cargo build -p arenad` and `<target>/<profile>/arenad`
# keep working for scripts and programs written before the rename. Use shaked in anything new.
[package]
name = "arenad"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "arenad"
path = "../shaked/src/main.rs"

[dependencies]
shaked = { path = "../shaked" }
parts = { path = "../parts" }
tokio = { workspace = true }
anyhow = { workspace = true }
axum = "0.8"

[lints]
workspace = true
