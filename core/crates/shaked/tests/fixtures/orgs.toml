# Two customer orgs for the tenancy tests (row-level security, the store's scopes, the router), each with one team
# and one user per org role. Test data only: example.test addresses, made-up names.

[[org]]
key = "a"
id = "0a000000-0000-0000-0000-000000000001"
slug = "test-org-a"
name = "Test Org A"
team = { id = "0a000000-0000-0000-0000-0000000000f1", slug = "team-a", name = "Team A" }

[[org]]
