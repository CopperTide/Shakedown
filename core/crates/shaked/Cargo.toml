[package]
name = "shaked"
version = "0.1.0"
edition = "2021"

[dependencies]
parts = { path = "../parts" }
shakedown-project = { path = "../project" }
schemars = { workspace = true }
serde_yaml_ng = { workspace = true }
similar = { workspace = true }
madl = { workspace = true }
shakedown-schema = { path = "../shakedown-schema" }
deadpool-postgres = { version = "0.14", default-features = false, features = ["rt_tokio_1"] }
tokio = { workspace = true }
tokio-postgres = { workspace = true, features = ["with-uuid-1"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["serde"] }
chrono = { workspace = true }
axum = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
toml = "0.8"
sha2 = { workspace = true }
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
libc = "0.2"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
base64 = "0.22"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
object_store = { version = "=0.12.5", default-features = false, features = ["aws", "fs"] }

[features]
# `shaked::harness`: the route table, a spy layer and app helpers, for this crate's tests and for
# crates that embed shaked with a layer of their own.
harness = []

[dev-dependencies]
tempfile = { workspace = true }
tower = { version = "0.5", features = ["util"] }
shaked = { path = ".", features = ["harness"] }
uuid = { workspace = true, features = ["serde"] }

[lints]
workspace = true
