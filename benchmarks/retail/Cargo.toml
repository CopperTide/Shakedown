[package]
name = "shakedown-retail"
version = "0.1.0"
edition = "2021"

[lib]
name = "shakedown_retail"
path = "src/lib.rs"

[[bin]]
name = "shakedown-retail"
path = "src/main.rs"

# The program's name until 2026-11-19, built too for scripts that still run it.
[[bin]]
name = "arena-retail"
path = "src/old_name.rs"

[dependencies]
shakedown-part = { path = "../../kits/rust", features = ["postgres"] }
tokio.workspace = true
serde_json.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tokio-postgres.workspace = true

unicode-normalization = "0.1"

[lints]
workspace = true
