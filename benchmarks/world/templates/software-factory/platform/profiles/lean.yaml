# The lean profile (the `observability` system's default): every container capped so the platform fits in about
# 3 GB beside the twins (budget.yaml), and each program told its own limit so it degrades instead of being killed.
MEM_PROD_DB: 160m
MEM_PROD_STOREFRONT: 96m
MEM_PROD_ORDERS: 96m
MEM_PROD_INVENTORY: 96m
MEM_PROD_SEED: 32m
MEM_STAGING_DB: 128m
MEM_STAGING_STOREFRONT: 80m
MEM_STAGING_ORDERS: 80m
MEM_STAGING_INVENTORY: 80m
MEM_STAGING_SEED: 32m
MEM_OTEL_COLLECTOR: 96m
MEM_WORLDCLOCK_GATEWAY: 32m
MEM_PROMETHEUS: 192m
MEM_ALERTMANAGER: 48m
MEM_LOKI: 192m
MEM_TEMPO: 160m
MEM_GRAFANA: 160m
MEM_GLITCHTIP_DB: 96m
MEM_GLITCHTIP: 320m
MEM_GLITCHTIP_WORKER: 128m  # full profile only

PG_PROD_SHARED_BUFFERS: 32MB
PG_STAGING_SHARED_BUFFERS: 16MB
PG_GLITCHTIP_MAX_CONNECTIONS: 20

GOMEMLIMIT_OTEL_COLLECTOR: 80MiB
GOMEMLIMIT_PROMETHEUS: 150MiB
GOMEMLIMIT_ALERTMANAGER: 32MiB
GOMEMLIMIT_LOKI: 150MiB
GOMEMLIMIT_TEMPO: 120MiB
GOMEMLIMIT_GRAFANA: 128MiB

PROMETHEUS_RETENTION: 2d
LOKI_RETENTION: 48h
TEMPO_CONFIG: lean.yaml
GRAFANA_ALERTING: "false"
GLITCHTIP_ROLE: all_in_one
