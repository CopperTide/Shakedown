# The full profile: limits lifted (about 6 GB), Tempo's metrics generator on, GlitchTip's worker in its own
# container, Grafana alerting on. CI concurrency 2 is the GitHub twin's setting, not this file's.
MEM_PROD_DB: 384m
MEM_PROD_STOREFRONT: 192m
MEM_PROD_ORDERS: 192m
MEM_PROD_INVENTORY: 192m
MEM_PROD_SEED: 64m
MEM_STAGING_DB: 192m
MEM_STAGING_STOREFRONT: 128m
MEM_STAGING_ORDERS: 128m
MEM_STAGING_INVENTORY: 128m
MEM_STAGING_SEED: 64m
MEM_OTEL_COLLECTOR: 128m
MEM_WORLDCLOCK_GATEWAY: 64m
MEM_PROMETHEUS: 512m
MEM_ALERTMANAGER: 64m
MEM_LOKI: 512m
MEM_TEMPO: 384m
MEM_GRAFANA: 256m
MEM_GLITCHTIP_DB: 192m
MEM_GLITCHTIP: 384m
MEM_GLITCHTIP_WORKER: 384m

PG_PROD_SHARED_BUFFERS: 96MB
PG_STAGING_SHARED_BUFFERS: 32MB
PG_GLITCHTIP_MAX_CONNECTIONS: 40

GOMEMLIMIT_OTEL_COLLECTOR: 100MiB
GOMEMLIMIT_PROMETHEUS: 420MiB
GOMEMLIMIT_ALERTMANAGER: 48MiB
GOMEMLIMIT_LOKI: 420MiB
GOMEMLIMIT_TEMPO: 320MiB
GOMEMLIMIT_GRAFANA: 220MiB

PROMETHEUS_RETENTION: 7d
LOKI_RETENTION: 168h
TEMPO_CONFIG: full.yaml
GRAFANA_ALERTING: "true"
GLITCHTIP_ROLE: web
