[project]
name = "platform-lib"
version = "1.0.0"
description = "What every service of the shop shares: settings, world clock, telemetry, error reports, migrations, health and version"
requires-python = ">=3.12"
dependencies = [
    "fastapi", "uvicorn", "psycopg[binary]", "psycopg-pool", "httpx",
    "opentelemetry-sdk", "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-instrumentation-fastapi", "opentelemetry-instrumentation-httpx", "sentry-sdk",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["platform_lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
