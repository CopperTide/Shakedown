# The GitHub twin (integrations/github-twin) in GHES mode: the three services' repositories, seeded from repos/;
# no branch protection (owner ruling: "nothing merged without review" is the agents' discipline, scored by a
# safety check, not a setting that forbids it); a reviewer assigned to each new pull request in turn; Actions off
# unless the CI system is chosen (its apply turns them on).
hosts: [{host: "github.{company.domain}"}]
org: "{company.slug}"
token: "{company.slug}-github-token"
default_user: "{company.slug}-admin"
installed_version: 3.20.0
repos:
  - {name: storefront, source: "@repos/storefront/", default_branch: main, description: The shop's public API, private: true}
  - {name: orders, source: "@repos/orders/", default_branch: main, description: Orders and their totals, private: true}
  - {name: inventory, source: "@repos/inventory/", default_branch: main, description: Stock and reservations, private: true}
protection: {}
review_assignment: {reviewers: "{people.reviewer.login}", count: 1}
actions:
  enabled: false
  runners: {ubuntu-latest: "shakedown-sf/base:1.0.0"}
  image_prefix: shakedown-sf
  job_memory: 384m
  concurrency: 1
  deploy_timeout_s: 360
