[project]
name = "worldbench"
version = "0.1.0"
description = "World builder: templates as data, deterministic generation, and the benchmark a built world runs as"
requires-python = ">=3.11"
dependencies = ["shakedown-part", "pyyaml>=6", "jsonschema>=4.18"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worldbench"]

[tool.uv.sources]
shakedown-part = { path = "../../kits/python", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = ["live: needs services or hardware not always present"]
