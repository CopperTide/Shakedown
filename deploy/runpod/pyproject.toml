[project]
name = "gpupod"
version = "0.1.0"
description = "Shakedown's RunPod operations for a custom model: quote, start within the budget, idle watchdog, spend ledger, billing reconcile, smoke test"
requires-python = ">=3.11"
dependencies = ["shakedown", "httpx==0.28.1"]

[project.scripts]
gpupod = "gpupod.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.uv.sources]
shakedown = { path = "../../sdk/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gpupod"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
