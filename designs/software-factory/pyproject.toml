[project]
name = "factory-designs"
version = "0.1.0"
description = "Two agent designs for Shakedown's software-factory world: a LangGraph team and one Agents SDK engineer"
requires-python = ">=3.11"
# Pinned: the designs are compared, so both run on the same frameworks every time.
dependencies = [
    "shakedown-sdk[langgraph,openai-agents]",
    "langgraph==1.2.22",
    "langchain-core==1.7.7",
    "langchain-openai==1.7.4",
    "openai-agents==0.20.0",
    "openai==2.54.0",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.uv.sources]
shakedown-sdk = { path = "../../sdk/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factory_designs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["live: needs Docker or services not always present"]
