[[price]]
provider = "anthropic"
model = "claude-haiku-5-5"
input_per_mtok = 0.10
output_per_mtok = 0.50
long_context_above = 100000
long_input_per_mtok = 0.50
long_output_per_mtok = 2.50
source = "https://platform.claude.com/docs/en/about-claude/pricing"
as_of = "2026-10-06"

# Claude Haiku 5.5's price depends on the prompt's length (two tiers): a per-agent token total
# can't tell them apart, so totals are never priced with it; one call at a time is (the spend limit).
