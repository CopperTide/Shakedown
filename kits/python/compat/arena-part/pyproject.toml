# `arena-part`, the Python kit's distribution name until 2026-11-19: it installs `shakedown-part` (whose
# wheel also carries the old `arena_part` import as an alias) and nothing else. New parts depend on
# shakedown-part.
[project]
name = "arena-part"
version = "0.1.0"
description = "The old name of the Shakedown Python kit: installs shakedown-part"
requires-python = ">=3.10"
dependencies = ["shakedown-part @ git+https://github.com/CopperTide/Shakedown#subdirectory=kits/python"]

[tool.uv.sources]
shakedown-part = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
bypass-selection = true
