[package]
name = "arena-sculptured"
version = "0.1.0"
edition = "2021"

[lib]
name = "arena_sculptured"
path = "src/lib.rs"

[[bin]]
name = "shakedown-sculptured"
path = "src/main.rs"

# The program's name until 2026-11-19, built too for scripts that still run it.
[[bin]]
name = "arena-sculptured"
path = "src/old_name.rs"

[dependencies]
arena-part = { path = "../../kits/rust", features = ["http"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
async-trait.workspace = true

[lints]
workspace = true
