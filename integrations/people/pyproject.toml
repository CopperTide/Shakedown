[project]
name = "people"
version = "0.1.0"
description = "shakedown-part/1 integration: simulated people who act on the world clock by rules written as data"
requires-python = ">=3.10"
dependencies = ["shakedown-part", "jsonschema>=4.18"]

[dependency-groups]
dev = ["pyyaml>=6"]

[tool.uv]
package = false

[tool.uv.sources]
shakedown-part = { path = "../../kits/python", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "fixtures", "__pycache__"]
pythonpath = [".", "tests"]
markers = ["live: needs services or hardware not always present"]
