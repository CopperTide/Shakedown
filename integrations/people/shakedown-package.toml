kind = "integration"
name = "people"
version = "0.1.0"
protocol = 1
run = { command = ["uv", "run", "--project", ".", "python", "-m", "people_part"] }
needs = { gpu_vram_gb = 0, services = [] }
config_schema = { type = "object", required = ["people", "rules"], properties = { seed = { type = "integer" }, people = { type = "array" }, rules = { type = "object" }, systems = { type = "array" } } }

