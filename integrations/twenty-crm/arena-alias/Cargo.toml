# `arena-twenty-crm`, this package's name until 2026-11-19: it builds the same program under its old name, so
# `cargo build -p arena-twenty-crm` and the program `arena-twenty-crm` keep working for scripts written before (the
# Shakedown-Examples stacks build and run it). Use shakedown-twenty-crm in anything new.
[package]
name = "arena-twenty-crm"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "arena-twenty-crm"
path = "../src/main.rs"

[dependencies]
shakedown-twenty-crm = { path = ".." }
shakedown-part = { path = "../../../kits/rust" }
anyhow = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
