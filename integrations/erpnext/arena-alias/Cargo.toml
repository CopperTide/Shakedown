# `arena-erpnext`, this package's name until 2026-11-19: it builds the same program under its old name, so
# `cargo build -p arena-erpnext` and the program `arena-erpnext` keep working for scripts written before (the
# Shakedown-Examples stacks build and run it). Use shakedown-erpnext in anything new.
[package]
name = "arena-erpnext"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "arena-erpnext"
path = "../src/main.rs"

[dependencies]
shakedown-erpnext = { path = ".." }
shakedown-part = { path = "../../../kits/rust" }
anyhow = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
