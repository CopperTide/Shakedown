[project]
name = "github-twin"
version = "0.1.0"
description = "arena-part/1 integration: a GitHub-compatible twin (GHES mode) over real git repositories"
requires-python = ">=3.10"
dependencies = ["arena-part"]

[dependency-groups]
dev = ["jsonschema>=4.18"]

[tool.uv]
package = false

[tool.uv.sources]
arena-part = { path = "../../kits/python", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "fixtures", "schemas", "__pycache__"]
pythonpath = ["."]
markers = ["live: needs services or hardware not always present"]
