[project]
name = "slack-twin"
version = "0.1.0"
description = "shakedown-part/1 integration: a Slack-compatible twin (the Web API chat methods agents use)"
requires-python = ">=3.10"
dependencies = ["shakedown-part"]

[dependency-groups]
dev = ["jsonschema>=4.18", "slack_sdk>=3.30"]

[tool.uv]
package = false

[tool.uv.sources]
shakedown-part = { path = "../../kits/python", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "fixtures", "schemas", "__pycache__"]
pythonpath = ["."]
markers = ["live: needs services or hardware not always present"]
