kind = "integration"
name = "service"
version = "0.1.0"
protocol = 1
run = { command = ["${ARENA_BIN_DIR}/arena-service"] }
needs = { gpu_vram_gb = 0, services = [] }
config_schema = { type = "object", required = ["compose_file", "volumes"], properties = { compose_file = { type = "string", description = "Path of the Docker Compose file" }, volumes = { type = "array", items = { anyOf = [{ type = "string" }, { type = "object", required = ["name"], properties = { name = { type = "string" }, save = { type = "string", enum = ["tar", "postgres", "hardlink", "skip"] }, services = { type = "array", items = { type = "string" } }, service = { type = "string" }, database = { type = "string" }, user = { type = "string" } } }] }, description = "Volumes of the compose file that a save holds: a name (saved as tar) or {name, save, ...}" }, helper_image = { type = "string", description = "Image with tar, sh, cp, find, stat and awk that copies volumes, archives and hard-linked trees (default redis:6.2-alpine, never pulled)" }, http = { type = "array", items = { type = "object", required = ["host", "service", "port"], properties = { host = { type = "string" }, service = { type = "string" }, port = { type = "integer" }, env = { type = "object" }, reads = { type = "array", items = { type = "string" } } } }, description = "Hosts the instance serves through arenad's proxy" }, env = { type = "object", description = "Extra environment for docker compose" } } }
