[package]
name = "shakedown-service"
version = "0.1.0"
edition = "2021"

[lib]
name = "shakedown_service"
path = "src/lib.rs"

[[bin]]
name = "shakedown-service"
path = "src/main.rs"

# The program's name until 2026-11-19, built too for scripts that still run it.
[[bin]]
name = "arena-service"
path = "src/old_name.rs"

[[bin]]
name = "shakedown-live-service"
path = "src/live_main.rs"

# The program's name until 2026-11-19, built too for scripts that still run it.
[[bin]]
name = "arena-live-service"
path = "src/old_live_name.rs"

[dependencies]
shakedown-part = { path = "../../kits/rust", features = ["compose", "http"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
async-trait.workspace = true
sha2.workspace = true

[lints]
workspace = true
