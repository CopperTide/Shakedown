[package]
name = "shakedown-mariadb"
version = "0.1.0"
edition = "2021"

[lib]
name = "shakedown_mariadb"
path = "src/lib.rs"

[[bin]]
name = "shakedown-mariadb"
path = "src/main.rs"

# The program's name until 2026-11-19, built too for scripts that still run it.
[[bin]]
name = "arena-mariadb"
path = "src/old_name.rs"

[dependencies]
shakedown-part = { path = "../../kits/rust", features = ["mariadb"] }
mysql_async.workspace = true
sha2.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
async-trait.workspace = true

[lints]
workspace = true
