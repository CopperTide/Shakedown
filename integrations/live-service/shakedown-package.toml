kind = "integration"
name = "live-service"
version = "0.1.0"
protocol = 1
run = { command = ["${SHAKEDOWN_BIN_DIR}/shakedown-live-service"] }
needs = { gpu_vram_gb = 0, services = [] }
config_schema = { type = "object", required = ["compose_file", "volumes"], properties = { compose_file = { type = "string", description = "Path of the Docker Compose file" }, volumes = { type = "array", items = { anyOf = [{ type = "string" }, { type = "object", required = ["name"], properties = { name = { type = "string" }, save = { type = "string", enum = ["tar", "postgres", "hardlink", "skip"] }, services = { type = "array", items = { type = "string" } }, service = { type = "string" }, database = { type = "string" }, user = { type = "string" }, live_copy = { type = "boolean", description = "Copied while everything runs: nothing stops for it" } } }] }, description = "Volumes of the compose file that a save holds: a name (saved as tar) or {name, save, ...}" }, helper_image = { type = "string", description = "Image with tar, sh, cp, find, stat and awk that copies volumes, archives and hard-linked trees (default redis:6.2-alpine, never pulled)" }, http = { type = "array", items = { type = "object", required = ["host", "service", "port"], properties = { host = { type = "string" }, service = { type = "string" }, port = { type = "integer" }, env = { type = "object" }, reads = { type = "array", items = { type = "string" } } } }, description = "Hosts the instance serves through shaked's proxy" }, live = { type = "boolean", description = "Write the world clock to clock.json in ARENA_CLOCK_DIR at start and each advance" }, watches = { type = "array", items = { type = "object", required = ["probe", "every_ms", "items", "id", "on", "off"], properties = { probe = { type = "string" }, every_ms = { type = "integer" }, items = { type = "string" }, id = { type = "string" }, on = { type = "string" }, off = { type = "string" }, fields = { type = "object" } } }, description = "Probes polled on the world clock whose items appearing and going are events" }, deploy_wait_s = { type = "integer", description = "How long service_deploy waits for a healthy service (default 300)" }, probes = { type = "array", items = { type = "object", required = ["key", "service", "port", "path"], properties = { key = { type = "string" }, service = { type = "string" }, port = { type = "integer" }, path = { type = "string", description = "{world_ms} and {world_s} are the world time" }, headers = { type = "object" } } }, description = "Docs read over HTTP (GET, 2 s) from the project's services, kept in saves" }, images = { type = "object", description = "The image of each compose service, passed as IMAGE_<SERVICE>; kept in saves" }, env = { type = "object", description = "Extra environment for docker compose" } } }
